<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Library Book Management System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:wght@600&display=swap">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <a class="skip-link" href="#main">Skip to main content</a>

    <div class="app" id="app">
        <header class="topbar">
            <button class="btn btn-secondary btn-icon nav-toggle" id="navToggle"
                    aria-controls="sidebar" aria-expanded="false" aria-label="Open navigation menu">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" aria-hidden="true">
                    <path d="M4 6h16M4 12h16M4 18h16"/></svg>
            </button>
            <a class="brand" href="#/dashboard">Library Book Management System</a>
            <nav class="crumbs" aria-label="Breadcrumb" id="crumbs"></nav>
        </header>

        <aside class="sidebar" id="sidebar" aria-label="Main navigation">
            <nav><ul class="nav-list" id="navList"></ul></nav>
        </aside>
        <div class="scrim" id="scrim" hidden></div>

        <main class="main" id="main" tabindex="-1"></main>
    </div>

    <div class="toasts" id="toasts" role="region" aria-label="Notifications" aria-live="polite"></div>

    <noscript><p class="noscript">This application needs JavaScript to run.</p></noscript>
    <script type="module" src="js/main.js"></script>
</body>
</html>
